<!DOCTYPE html>
<html>
<head>
<style>
body {
  background: #FFF9F0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  margin: 0;
}

.main {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px; /* 控制整体大小 */
  position: relative;
  width: 14em;
  height: 14em;
}

.loaders,
.loadersB {
  display: flex;
  align-items: center;
  justify-content: center;
  position: absolute;
}

/* 糖果风管道：浅粉白/奶油粉底色 + 柔和糖果内阴影 */
.loader {
  position: absolute;
  width: 1.15em;
  height: 13em;
  border-radius: 50px;
  background: #FFF5F7;
  border: 1px solid #FFE4EC;
  box-shadow: inset 0 0 4px rgba(255, 175, 195, 0.2);
}
.loader:after {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  width: 1.15em;
  height: 5em;
  background: #FFF5F7;
  border-radius: 50px;
  border: 1px solid #FFE4EC;
  box-shadow:
    inset 3px 3px 10px rgba(255, 182, 193, 0.35),
    inset -3px -3px 10px rgba(255, 255, 255, 0.9);
  mask-image: linear-gradient(
    to bottom,
    black calc(100% - 48px),
    transparent 100%
  );
  -webkit-mask-image: linear-gradient(
    to bottom,
    black calc(100% - 48px),
    transparent 100%
  );
}
.loader::before {
  content: "";
  position: absolute;
  bottom: 0;
  right: 0;
  width: 1.15em;
  height: 4.5em;
  background: #FFF5F7;
  border-radius: 50px;
  border: 1px solid #FFE4EC;
  box-shadow:
    inset 3px 3px 10px rgba(255, 182, 193, 0.35),
    inset -3px -3px 10px rgba(255, 255, 255, 0.9);
  mask-image: linear-gradient(
    to top,
    black calc(100% - 48px),
    transparent 100%
  );
  -webkit-mask-image: linear-gradient(
    to top,
    black calc(100% - 48px),
    transparent 100%
  );
}
.loaderA {
  position: absolute;
  width: 1.15em;
  height: 13em;
  border-radius: 50px;
  background: transparent;
}

/* 糖果风小球：草莓马卡龙粉 + 晶莹立体质感 */
.ball0,
.ball1,
.ball2,
.ball3,
.ball4,
.ball5,
.ball6,
.ball7,
.ball8,
.ball9 {
  width: 1.15em;
  height: 1.15em;
  box-shadow:
    rgba(219, 68, 107, 0.25) 0px -6px 8px 0px inset,
    rgba(255, 140, 168, 0.3) 0px -10px 12px 0px inset,
    rgba(255, 255, 255, 0.8) 0px 3px 4px 0px inset,
    rgba(255, 112, 143, 0.25) 0px 4px 8px,
    rgba(255, 182, 193, 0.2) 0px 8px 16px;
  border-radius: 50%;
  transition: transform 800ms cubic-bezier(1, -0.4, 0, 1.4);
  background: linear-gradient(135deg, #FF99AF 0%, #FF5C8A 100%);
  animation: 3.63s move ease-in-out infinite;
}

.loader:nth-child(2) { transform: rotate(20deg); }
.loader:nth-child(3) { transform: rotate(40deg); }
.loader:nth-child(4) { transform: rotate(60deg); }
.loader:nth-child(5) { transform: rotate(80deg); }
.loader:nth-child(6) { transform: rotate(100deg); }
.loader:nth-child(7) { transform: rotate(120deg); }
.loader:nth-child(8) { transform: rotate(140deg); }
.loader:nth-child(9) { transform: rotate(160deg); }

.loaderA:nth-child(2) { transform: rotate(20deg); }
.loaderA:nth-child(3) { transform: rotate(40deg); }
.loaderA:nth-child(4) { transform: rotate(60deg); }
.loaderA:nth-child(5) { transform: rotate(80deg); }
.loaderA:nth-child(6) { transform: rotate(100deg); }
.loaderA:nth-child(7) { transform: rotate(120deg); }
.loaderA:nth-child(8) { transform: rotate(140deg); }
.loaderA:nth-child(9) { transform: rotate(160deg); }

.ball1 { animation-delay: 0.2s; }
.ball2 { animation-delay: 0.4s; }
.ball3 { animation-delay: 0.6s; }
.ball4 { animation-delay: 0.8s; }
.ball5 { animation-delay: 1s; }
.ball6 { animation-delay: 1.2s; }
.ball7 { animation-delay: 1.4s; }
.ball8 { animation-delay: 1.6s; }
.ball9 { animation-delay: 1.8s; }

@keyframes move {
  0% { transform: translateY(0em); }
  50% { transform: translateY(11.85em); }
  100% { transform: translateY(0em); }
}
</style>
</head>
<body>
<div class="main">
  <div class="loaders">
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
    <div class="loader"></div>
  </div>
  <div class="loadersB">
    <div class="loaderA"><div class="ball0"></div></div>
    <div class="loaderA"><div class="ball1"></div></div>
    <div class="loaderA"><div class="ball2"></div></div>
    <div class="loaderA"><div class="ball3"></div></div>
    <div class="loaderA"><div class="ball4"></div></div>
    <div class="loaderA"><div class="ball5"></div></div>
    <div class="loaderA"><div class="ball6"></div></div>
    <div class="loaderA"><div class="ball7"></div></div>
    <div class="loaderA"><div class="ball8"></div></div>
  </div>
</div>
</body>
</html>
